<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WonderWorld Live</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* ================= GLOBAL ================= */
body {
  margin: 0;
  font-family: system-ui;
  background: radial-gradient(circle at top, #0b1220, #05070f);
  color: white;
  overflow-x: hidden;
}

.orb {
  position: fixed;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.5;
  animation: float 10s infinite ease-in-out;
}

.orb.blue { background: #3b82f6; top: -150px; left: -120px; }
.orb.purple { background: #8b5cf6; bottom: -180px; right: -150px; }

@keyframes float {
  0% { transform: translate(0,0); }
  50% { transform: translate(80px, 60px); }
  100% { transform: translate(0,0); }
}

/* ================= HEADER ================= */
header {
  text-align: center;
  padding: 20px;
}

h1 {
  font-size: 20px;
}

/* ================= TAGS ================= */
.tags {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  padding: 10px;
}

.tag {
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  font-size: 12px;
}

/* ================= GRID ================= */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
  padding: 15px;
}

/* ================= CARD ================= */
.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.03);
  border-color: #3b82f6;
}

.card iframe {
  width: 100%;
  height: 180px;
  border: none;
}

.card-title {
  padding: 10px;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
}

/* ================= WATCH VIEW ================= */
#watchView {
  display: none;
  padding: 15px;
}

.back {
  margin-bottom: 10px;
  display: inline-block;
  padding: 8px 12px;
  background: rgba(255,255,255,0.08);
  border-radius: 8px;
  cursor: pointer;
}

.watch-box {
  background: rgba(255,255,255,0.05);
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
}

.watch-box iframe {
  width: 100%;
  height: 60vh;
  border: none;
}

/* ================= MOBILE FIX ================= */
@media (max-width: 768px) {
  h1 { font-size: 16px; }
  .grid { grid-template-columns: 1fr; }
  .card iframe { height: 200px; }
}
</style>
</head>

<body>

<div class="orb blue"></div>
<div class="orb purple"></div>

<!-- HOME VIEW -->
<div id="homeView">

<header>
  <h1> WonderWorld Live Experience</h1>
</header>

<div class="tags">
  <div class="tag">🌆 Street</div>
  <div class="tag">🐘 Safari</div>
  <div class="tag">🌲 Forest</div>
  <div class="tag">🏔 Mountain</div>
  <div class="tag">❄ Snow</div>
</div>

<div class="grid" id="grid"></div>

</div>

<!-- WATCH VIEW -->
<div id="watchView">

  <div class="back" onclick="goBack()">← Back</div>

  <div class="watch-box">
    <iframe id="player"></iframe>
  </div>

</div>

<script>
const cams = [
  { id: 1, title: "Dubai Street Cam", url: "https://www.youtube.com/embed/live_stream?channel=UC4R8DWoMoI7CAwX8_LjQHig" },
  { id: 2, title: "African Safari", url: "https://www.youtube.com/embed/ydYDqZQpim8" },
  { id: 3, title: "Forest Life", url: "https://www.youtube.com/embed/9No-FiEInLA" },
  { id: 4, title: "Mountain View", url: "https://www.youtube.com/embed/6QF3p2k0a9k" },
  { id: 5, title: "Snow World", url: "https://www.youtube.com/embed/fV3CpX1Jr8Q" }
];

const grid = document.getElementById("grid");

cams.forEach(cam => {
  grid.innerHTML += `
    <div class="card" onclick="openCam('${cam.url}')">
      <iframe src="${cam.url}"></iframe>
      <div class="card-title">
        ${cam.title}
        <span>LIVE</span>
      </div>
    </div>
  `;
});

function openCam(url){
  document.getElementById("homeView").style.display = "none";
  document.getElementById("watchView").style.display = "block";
  document.getElementById("player").src = url;
}

function goBack(){
  document.getElementById("watchView").style.display = "none";
  document.getElementById("homeView").style.display = "block";
}
</script>

</body>
</html>
