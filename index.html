<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Live Cams</title>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #050814;
  color: white;
}

header {
  text-align: center;
  padding: 18px;
}

h1 { font-size: 18px; margin: 0; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
  padding: 15px;
}

.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: 0.25s;
}

.card:hover {
  transform: scale(1.02);
  border-color: #3b82f6;
}

.card iframe {
  width: 100%;
  aspect-ratio: 16/9;
  border: none;
}

.title {
  padding: 10px;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
}

.badge { color: #22c55e; }

/* WATCH */
#watch {
  display: none;
  padding: 15px;
}

.back {
  display: inline-block;
  padding: 8px 12px;
  background: rgba(255,255,255,0.08);
  border-radius: 8px;
  margin-bottom: 10px;
  cursor: pointer;
}

.player {
  width: 100%;
  height: 70vh;
  border: none;
  border-radius: 12px;
}
</style>
</head>

<body>

<header>
  <h1>🌍 World Live Experience</h1>
</header>

<!-- HOME -->
<div id="home">

<div class="grid" id="grid"></div>

</div>

<!-- WATCH -->
<div id="watch">

<div class="back" onclick="back()">← Back</div>

<iframe id="player" class="player"></iframe>

</div>

<script>

/* -----------------------------
   ONLY STABLE PUBLIC CAMS
------------------------------*/
const cams = [
  {
    title: "🐘 Namibia Safari Live",
    url: "https://www.youtube.com/embed/ydYDqZQpim8"
  },
  {
    title: "🐘 African Wildlife Cam",
    url: "https://www.youtube.com/embed/9No-FiEInLA"
  },
  {
    title: "🌲 Forest Nature Live",
    url: "https://www.youtube.com/embed/6QF3p2k0a9k"
  },
  {
    title: "🏔 Mountain View Live",
    url: "https://www.youtube.com/embed/fV3CpX1Jr8Q"
  },
  {
    title: "❄ Snow Region Cam",
    url: "https://www.youtube.com/embed/live_stream?channel=UCVHFbqXqoYvEWM1Ddxl0QDg"
  },

  /* SPORTS (LEGAL FREE CONTENT ONLY) */
  {
    title: "🏟 Sports Highlights Channel",
    url: "https://www.youtube.com/embed/live_stream?channel=UCWJ2lWNubArHWmf3FIHbfcQ"
  }
];

const grid = document.getElementById("grid");

cams.forEach(c => {
  grid.innerHTML += `
    <div class="card" onclick="openCam('${c.url}')">
      <iframe src="${c.url}" loading="lazy"></iframe>
      <div class="title">
        ${c.title}
        <span class="badge">LIVE</span>
      </div>
    </div>
  `;
});

function openCam(url){
  document.getElementById("home").style.display = "none";
  document.getElementById("watch").style.display = "block";
  document.getElementById("player").src = url;
}

function back(){
  document.getElementById("watch").style.display = "none";
  document.getElementById("home").style.display = "block";
  document.getElementById("player").src = "";
}

</script>

</body>
</html>
