<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Live Cams</title>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #050814;
  color: white;
}

header {
  text-align: center;
  padding: 18px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
  padding: 15px;
}

.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
}

.card iframe {
  width: 100%;
  aspect-ratio: 16/9;
  border: none;
}

.title {
  padding: 10px;
  font-size: 13px;
}

/* WATCH */
#watch {
  display: none;
  padding: 15px;
}

.back {
  display: inline-block;
  padding: 8px 12px;
  background: rgba(255,255,255,0.08);
  border-radius: 8px;
  margin-bottom: 10px;
  cursor: pointer;
}

.player {
  width: 100%;
  height: 70vh;
  border: none;
  border-radius: 12px;
}
</style>
</head>

<body>

<header>
  🌍 World Live Camera Network
</header>

<div id="home">
  <div class="grid" id="grid"></div>
</div>

<div id="watch">
  <div class="back" onclick="back()">← Back</div>
  <iframe id="player" class="player"></iframe>
</div>

<script>

/* ------------------------------
   REAL PUBLIC CAM SOURCES
   (stable non-YouTube embeds)
-------------------------------*/
const cams = [
  {
    title: "🐘 Africa Wildlife (Live)",
    url: "https://www.skylinewebcams.com/en/webcam/south-africa/western-cape/cape-town/table-mountain.html"
  },
  {
    title: "🏙 City Traffic Cam",
    url: "https://www.skylinewebcams.com/en/webcam/united-states/florida/miami/miami-beach.html"
  },
  {
    title: "🌲 Nature Forest Cam",
    url: "https://www.skylinewebcams.com/en/webcam/canada/british-columbia/vancouver/vancouver.html"
  },
  {
    title: "🏔 Mountain Live View",
    url: "https://www.skylinewebcams.com/en/webcam/switzerland/grisons/davos/davos.html"
  },
  {
    title: "❄ Snow Alps Cam",
    url: "https://www.skylinewebcams.com/en/webcam/italia/trentino-alto-adige/bolzano/mount-stelvio.html"
  }
];

const grid = document.getElementById("grid");

cams.forEach(c => {
  grid.innerHTML += `
    <div class="card" onclick="openCam('${c.url}')">
      <iframe src="${c.url}" loading="lazy"></iframe>
      <div class="title">${c.title}</div>
    </div>
  `;
});

function openCam(url){
  document.getElementById("home").style.display = "none";
  document.getElementById("watch").style.display = "block";
  document.getElementById("player").src = url;
}

function back(){
  document.getElementById("watch").style.display = "none";
  document.getElementById("home").style.display = "block";
  document.getElementById("player").src = "";
}

</script>

</body>
</html>
